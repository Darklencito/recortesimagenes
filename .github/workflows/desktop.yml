name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: release/*

  build-mac:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run electron:build:mac
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: mac-installer
          path: release/*

  build-installer:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Copy main installer for bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer -Force | Out-Null
          Copy-Item release/nodos-cortes-*-win-x64.exe installer/ -Force
          # Rename to the expected filename
          $f = Get-ChildItem installer/nodos-cortes-*-win-x64.exe | Select-Object -First 1
          Copy-Item $f.FullName installer/nodos-cortes-win-x64.exe -Force
      - name: Install installer deps
        working-directory: installer
        run: npm ci
      - name: Build custom installer
        working-directory: installer
        run: npm run build:win
      - uses: actions/upload-artifact@v5
        with:
          name: custom-installer
          path: installer/release/*

  create-release:
    needs: [build-windows, build-installer]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-installer
          path: release-win
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: custom-installer
          path: release-custom
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: mac-installer
          path: release-mac
      - name: Prepare release files
        run: |
          mkdir -p release-all
          cp release-win/* release-all/ 2>/dev/null || true
          if [ -d release-custom ]; then cp release-custom/* release-all/ 2>/dev/null || true; fi
          if [ -d release-mac ]; then cp release-mac/* release-all/ 2>/dev/null || true; fi
          ls -la release-all
      - uses: softprops/action-gh-release@v2
        with:
          files: release-all/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
